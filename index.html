<body class="bg-slate-100 text-slate-800 antialiased overflow-hidden">
    <div id="root"></div>

    <!-- 🌟 โหลดแอปผ่าน Babel โดยเปิดให้รองรับ jsx-runtime ได้อย่างสมบูรณ์ -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          BookOpen, ChevronRight, FileText, Scale, Gavel, 
          FileQuestion, ArrowLeft, Bot, FileDown, 
          Search, Info, Cpu, CheckCircle, FileWarning, ShieldAlert,
          ListChecks, Landmark, BookMarked, Database, AlertCircle, MessageCircle, Send, Layers, Library, X,
          RefreshCw, Settings, Eye, Link, Save, CheckCircle2, XCircle, Loader2, ChevronDown, ChevronUp, Table,
          Clock, Sparkles, ArrowUpRight, Star,
          Printer, Bell, TrendingUp, BarChart2, Key, Check, Globe
        } from 'lucide-react';

        // ==========================================
        // 0. Error Boundary
        // ==========================================
        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { hasError: false, error: null }; }
          static getDerivedStateFromError(error) { return { hasError: true, error }; }
          componentDidCatch(error, info) { console.error('[ErrorBoundary]', error, info); }
          render() {
            if (!this.state.hasError) return this.props.children;
            return (
              <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6">
                <div className="bg-white rounded-2xl shadow-lg border border-rose-100 p-8 max-w-md w-full text-center">
                  <div className="text-5xl mb-4">⚠️</div>
                  <h2 className="text-xl font-bold text-slate-800 mb-2">เกิดข้อผิดพลาด</h2>
                  <p className="text-slate-500 text-sm mb-6">แอพพบปัญหาที่ไม่คาดคิด กรุณารีโหลดหน้า หรือติดต่อผู้ดูแลระบบ</p>
                  <details className="text-left bg-slate-50 rounded-xl p-3 mb-5 text-xs text-slate-400 font-mono overflow-auto max-h-32">
                    {String(this.state.error?.message || '')}
                  </details>
                  <button onClick={() => window.location.reload()}
                    className="bg-[#006655] text-white px-6 py-3 rounded-xl font-bold hover:bg-teal-700 transition-colors">
                    รีโหลดหน้า
                  </button>
                </div>
              </div>
            );
          }
        }

        // ==========================================
        // 1. ค่าเริ่มต้น URL Google Sheets
        // ==========================================
        const DEFAULT_URLS = {
          manual:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQCudtZE4A7fADYbxtCugwUE1UJOrA6Yg6H2y1cy91mHfhIs_WGcdsR_KFIf9U_sgecG9eXs2QT1A6/pub?gid=0&single=true&output=csv',
          decision: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQCudtZE4A7fADYbxtCugwUE1UJOrA6Yg6H2y1cy91mHfhIs_WGcdsR_KFIf9U_sgecG9eXs2QT1A6/pub?gid=1813430095&single=true&output=csv',
          archive:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQCudtZE4A7fADYbxtCugwUE1UJOrA6Yg6H2y1cy91mHfhIs_WGcdsR_KFIf9U_sgecG9eXs2QT1A6/pub?gid=1273909036&single=true&output=csv',
          chatbot_คนต่างด้าว: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQCudtZE4A7fADYbxtCugwUE1UJOrA6Yg6H2y1cy91mHfhIs_WGcdsR_KFIf9U_sgecG9eXs2QT1A6/pub?gid=22287193&single=true&output=csv',
        };

        const URL_LABELS = {
          manual:   'คู่มืองานทะเบียน',
          decision: 'ระบบช่วยตัดสินใจ',
          archive:  'คลังเอกสาร',
          chatbot_คนต่างด้าว: 'Chatbot: คนต่างด้าว',
        };

        const CACHE_TTL = 30 * 60 * 1000;
        const cacheGet = (key) => { try { const raw = localStorage.getItem(`app_cache_${key}`); if (!raw) return null; const { data, ts } = JSON.parse(raw); if (Date.now() - ts > CACHE_TTL) { localStorage.removeItem(`app_cache_${key}`); return null; } return data; } catch { return null; } };
        const cacheSet = (key, data) => { try { localStorage.setItem(`app_cache_${key}`, JSON.stringify({ data, ts: Date.now() })); } catch {} };
        const cacheClear = () => { try { Object.keys(localStorage).filter(k => k.startsWith('app_cache_')).forEach(k => localStorage.removeItem(k)); } catch {} };
        const bookmarkLoad = () => { try { return JSON.parse(localStorage.getItem('app_bookmarks') || '[]'); } catch { return []; } };
        const bookmarkSave = (list) => { try { localStorage.setItem('app_bookmarks', JSON.stringify(list)); } catch {} };

        const useBookmarks = () => {
          const [bookmarks, setBookmarks] = useState(bookmarkLoad);
          const toggle = useCallback((item) => { setBookmarks(prev => { const exists = prev.some(b => b.id === item.id); const next = exists ? prev.filter(b => b.id !== item.id) : [item, ...prev]; bookmarkSave(next); return next; }); }, []);
          const isBookmarked = useCallback((id) => bookmarks.some(b => b.id === id), [bookmarks]);
          return { bookmarks, toggle, isBookmarked };
        };

        const visitedLoad = () => { try { return new Set(JSON.parse(localStorage.getItem('app_visited') || '[]')); } catch { return new Set(); } };
        const useVisited = () => {
          const [visited, setVisited] = useState(visitedLoad);
          const markVisited = useCallback((url) => { setVisited(prev => { if (prev.has(url)) return prev; const next = new Set(prev); next.add(url); try { localStorage.setItem('app_visited', JSON.stringify([...next])); } catch {} return next; }); }, []);
          const isVisited = useCallback((url) => visited.has(url), [visited]);
          return { markVisited, isVisited };
        };

        const ANALYTICS_KEY = 'app_analytics';
        const analyticsLoad = () => { try { return JSON.parse(localStorage.getItem(ANALYTICS_KEY) || '{"pageviews":[],"searches":[],"chatbotMisses":[]}'); } catch { return { pageviews: [], searches: [], chatbotMisses: [] }; } };
        const analyticsSave = (data) => { try { localStorage.setItem(ANALYTICS_KEY, JSON.stringify(data)); } catch {} };
        const analyticsClear = () => { try { localStorage.removeItem(ANALYTICS_KEY); } catch {} };

        const useAnalytics = () => {
          const trackPageview = useCallback((tab, title, path = []) => { const data = analyticsLoad(); data.pageviews.push({ tab, title, path: path.filter(Boolean).join(' › '), ts: Date.now() }); if (data.pageviews.length > 500) data.pageviews = data.pageviews.slice(-500); analyticsSave(data); }, []);
          const trackSearch = useCallback((query, resultCount) => { if (!query || query.length < 2) return; const data = analyticsLoad(); data.searches.push({ query, resultCount, ts: Date.now() }); if (data.searches.length > 200) data.searches = data.searches.slice(-200); analyticsSave(data); }, []);
          const trackChatbotMiss = useCallback((query, category) => { const data = analyticsLoad(); data.chatbotMisses.push({ query, category, ts: Date.now() }); if (data.chatbotMisses.length > 200) data.chatbotMisses = data.chatbotMisses.slice(-200); analyticsSave(data); }, []);
          return { trackPageview, trackSearch, trackChatbotMiss };
        };

        // ==========================================
        // 2. ฟังก์ชันประมวลผลข้อมูล
        // ==========================================
        const parseCSV = (csvText) => { const rows = []; let row = [], currentVal = '', inQuotes = false; for (let i = 0; i < csvText.length; i++) { const char = csvText[i], nextChar = csvText[i + 1]; if (char === '"' && inQuotes && nextChar === '"') { currentVal += '"'; i++; } else if (char === '"') { inQuotes = !inQuotes; } else if (char === ',' && !inQuotes) { row.push(currentVal); currentVal = ''; } else if ((char === '\n' || char === '\r') && !inQuotes) { if (char === '\r' && nextChar === '\n') i++; row.push(currentVal); rows.push(row); row = []; currentVal = ''; } else { currentVal += char; } } if (currentVal || row.length > 0) { row.push(currentVal); rows.push(row); } if (rows.length <= 1) return []; const headers = rows[0].map(h => h.trim()); return rows.slice(1).filter(r => r.join('').trim() !== '').map(r => { const obj = {}; headers.forEach((h, i) => { obj[h] = r[i] ? r[i].trim() : ''; }); return obj; }); };
        const getEmojiForTitle = (title) => { const t = typeof title === 'string' ? title : ''; if (t.includes('ต่างด้าว')) return '🌍'; if (t.includes('นิติบุคคล')) return '🏢'; if (t.includes('จดทะเบียน')) return '📝'; if (t.includes('ค่าธรรมเนียม') || t.includes('ภาษี')) return '💰'; if (t.includes('รัฐ')) return '🏞️'; if (t.includes('อาคารชุด')) return '🏙️'; if (t.includes('ออกเอกสาร')) return '📜'; if (t.includes('รังวัด')) return '📐'; if (t.includes('กฎหมาย') || t.includes('ศาล') || t.includes('พิพากษา')) return '⚖️'; if (t.includes('มรดก')) return '💎'; if (t.includes('ซื้อขาย')) return '🤝'; if (t.includes('จำนอง')) return '🏦'; if (t.includes('เช่า')) return '🏠'; return null; };
        const parsePDFs = (text) => { if (!text) return []; return text.split('\n').filter(line => line.includes('|')).map(line => { const [title, url] = line.split('|'); return { title: title?.trim() || '', url: url?.trim() || '' }; }); };
        const parseSection = (textCell, pdfCell) => { if (!textCell && !pdfCell) return []; const texts = textCell ? String(textCell).split(/\s*---\s*/) : []; const pdfs = pdfCell ? String(pdfCell).split(/\s*---\s*/) : []; const maxLength = Math.max(texts.length, pdfs.length); const result = []; for (let i = 0; i < maxLength; i++) { const t = texts[i] || '', p = pdfs[i] || ''; if (t.trim() || p.trim()) result.push({ text: t.trim(), pdfUrls: parsePDFs(p) }); } return result; };
        const parseList = (text) => text ? text.split('\n').map(i => i.trim()).filter(Boolean) : [];

        const transformManualData = (csvData) => { const result = []; csvData.forEach(row => { const getVal = (...keys) => { for (let k of keys) { const foundKey = Object.keys(row).find(rKey => rKey.trim().toLowerCase() === k.toLowerCase()); if (foundKey !== undefined) return row[foundKey]; } return ''; }; const mainCat = getVal('MainCategory', 'หมวดหมู่หลัก'); if (!mainCat) return; let main = result.find(m => m.title === mainCat); if (!main) { main = { id: `m${result.length+1}`, title: mainCat, iconUrl: getVal('MainIconURL'), subCategories: [] }; result.push(main); } const subCat = getVal('SubCategory', 'หมวดหมู่ย่อย') || ''; let sub = main.subCategories.find(s => s.title === subCat); if (!sub) { sub = { id: `s${main.id}-${main.subCategories.length+1}`, title: subCat, iconUrl: getVal('SubIconURL'), topics: [] }; main.subCategories.push(sub); } sub.topics.push({ id: `t${sub.id}-${sub.topics.length+1}`, title: getVal('TopicTitle', 'ชื่อเรื่อง') || '', iconUrl: getVal('TopicIconURL', 'ลิงก์รูปภาพ'), content: { meaning: parseSection(getVal('Meaning', 'ความหมาย'), getVal('MeaningPDF')), summary: parseSection(getVal('Summary', 'สาระสำคัญ', 'ขั้นตอนดำเนินการ'), getVal('SummaryPDF')), laws: parseSection(getVal('Laws', 'กฎหมาย'), getVal('LawsPDF')), courtRulings: parseSection(getVal('CourtRulings', 'แนวคำพิพากษา'), getVal('CourtRulingsPDF')), councilRulings: parseSection(getVal('CouncilRulings', 'คำวินิจฉัยกฤษฎีกา'), getVal('CouncilRulingsPDF')), deptRulings: parseSection(getVal('DeptRulings', 'แนวคำวินิจฉัย'), getVal('DeptRulingsPDF')), qna: parseSection(getVal('QnA', 'คำถามคำตอบ'), getVal('QnAPDF')), handbooks: parseSection(getVal('Handbooks', 'หนังสือคู่มือ'), getVal('HandbooksPDF')) } }); }); return result; };
        const transformDecisionData = (csvData) => { const rules = []; csvData.forEach(row => { const getVal = (...keys) => { for (let k of keys) { const searchKey = k.replace(/[\s\uFEFF\u200B]/g, '').toLowerCase(); const foundKey = Object.keys(row).find(rKey => rKey.replace(/[\s\uFEFF\u200B]/g, '').toLowerCase() === searchKey); if (foundKey !== undefined) return String(row[foundKey]).trim(); } return ''; }; const reqType = getVal('ประเภทคำขอ', 'RequestType'); if (!reqType) return; const conditions = []; for (let i = 1; i <= 4; i++) { const field = getVal(`เงื่อนไข:ชื่อฟิลด์(${i})`, `Field${i}`); if (!field) continue; conditions.push({ field, operator: getVal(`เงื่อนไข:ตัวดำเนินการ(${i})`, `Operator${i}`), value: getVal(`เงื่อนไข:ค่า(${i})`, `Value${i}`), logic: getVal(`เงื่อนไข:ตรรกะ(${i})`, `Logic${i}`) || 'AND', }); } rules.push({ requestType: reqType, ruleId: getVal('รหัสกฎ', 'RuleId'), priority: parseInt(getVal('ลำดับความสำคัญ', 'Priority')) || 999, conditions, status: getVal('สถานะ', 'Status').toLowerCase() || 'info', diagnosis: getVal('หัวข้อวินิจฉัย', 'Diagnosis'), summary: getVal('สรุปผลการพิจารณา', 'Summary'), reason: getVal('คำอธิบายเหตุผล', 'Reason'), reference: getVal('กฎหมายอ้างอิง', 'Reference'), nextStep: getVal('ขั้นตอนถัดไป', 'NextStep'), documents: parseList(getVal('เอกสารที่ต้องใช้', 'Documents')) }); }); return rules.sort((a, b) => a.priority - b.priority); };
        const evalCondition = (cond, userVal) => { if (!cond.field) return true; if (!userVal && userVal !== '0') return false; const op = (cond.operator || '').trim(); const cVal = (cond.value || '').trim(); const numU = parseFloat(userVal); const numC = parseFloat(cVal); switch (op) { case 'เท่ากับ': return userVal === cVal; case 'ไม่เท่ากับ': return userVal !== cVal; case 'อยู่ในกลุ่ม': return cVal.split(',').map(v => v.trim()).includes(userVal); case 'ไม่อยู่ในกลุ่ม': return !cVal.split(',').map(v => v.trim()).includes(userVal); case 'มากกว่า': return !isNaN(numU) && !isNaN(numC) && numU > numC; case 'มากกว่าหรือเท่ากับ': return !isNaN(numU) && !isNaN(numC) && numU >= numC; case 'น้อยกว่า': return !isNaN(numU) && !isNaN(numC) && numU < numC; case 'น้อยกว่าหรือเท่ากับ': return !isNaN(numU) && !isNaN(numC) && numU <= numC; case 'ระหว่าง': { const [lo, hi] = cVal.split('-').map(v => parseFloat(v.trim())); return !isNaN(numU) && numU >= lo && numU <= hi; } case 'มีคำว่า': return userVal.includes(cVal); default: return false; } };
        const transformChatbotData = (csvData, category) => { return csvData.map(row => { const getVal = (...keys) => { for (let k of keys) { const foundKey = Object.keys(row).find(rKey => rKey.trim().toLowerCase() === k.toLowerCase()); if (foundKey !== undefined) return row[foundKey]; } return ''; }; const keywordsText = getVal('Keywords', 'คีย์เวิร์ด'); const answer = getVal('Answer', 'คำตอบ'); if (!keywordsText || !answer) return null; return { category, keywords: keywordsText.split(',').map(k => k.trim().toLowerCase()).filter(Boolean), answer }; }).filter(Boolean); };
        const transformArchiveData = (csvData) => { const result = [ { id: 'a1', title: 'กฎหมาย', emoji: '⚖️', subCategories: [] }, { id: 'a2', title: 'กฎกระทรวง', emoji: '🏢', subCategories: [] }, { id: 'a3', title: 'ระเบียบคำสั่ง', emoji: '📋', subCategories: [] }, { id: 'a4', title: 'หนังสือเวียน', emoji: '✉️', subCategories: [] }, { id: 'a5', title: 'คำพิพากษาคำสั่งศาล', emoji: '🏛️', subCategories: [] }, { id: 'a6', title: 'คำวินิจฉัยคณะกรรมการ', emoji: '👨‍⚖️', subCategories: [] }, { id: 'a7', title: 'บทความ', emoji: '📰', subCategories: [] }, { id: 'a8', title: 'วารสาร', emoji: '📓', subCategories: [] }, { id: 'a9', title: 'หนังสือ/คู่มือ', emoji: '📚', subCategories: [] } ]; csvData.forEach(row => { const getVal = (...keys) => { for (let k of keys) { const foundKey = Object.keys(row).find(rKey => rKey.trim().toLowerCase() === k.toLowerCase()); if (foundKey !== undefined) return String(row[foundKey]).trim(); } return ''; }; const mainCat = getVal('หมวดหมู่หลัก', 'ArchiveCategory'); if (!mainCat) return; let main = result.find(m => m.title === mainCat); if (!main) { main = { id: `am${result.length+1}`, title: mainCat, emoji: getEmojiForTitle(mainCat) || '📁', subCategories: [] }; result.push(main); } const mainIcon = getVal('ลิงก์รูปภาพ (Icon URL)', 'MainIconURL'); if (mainIcon && !main.imageUrl) main.imageUrl = mainIcon; const sub1Title = getVal('เมนูย่อย 1', 'ArchiveSub1') || ''; let sub1 = main.subCategories.find(s => s.title === sub1Title); if (!sub1) { sub1 = { id: `as1-${main.id}-${main.subCategories.length+1}`, title: sub1Title, topics: [] }; main.subCategories.push(sub1); } const sub2Title = getVal('เมนูย่อย 2', 'ArchiveSub2') || ''; let sub2 = sub1.topics.find(t => t.title === sub2Title); if (!sub2) { sub2 = { id: `as2-${sub1.id}-${sub1.topics.length+1}`, title: sub2Title, documents: [] }; sub1.topics.push(sub2); } const docTitle = getVal('ชื่อเอกสาร', 'DocumentTitle'); const docUrl = getVal('ลิงก์เอกสาร', 'DocumentURL'); if (docTitle || docUrl) sub2.documents.push({ title: docTitle || 'เอกสารไม่มีชื่อ', url: docUrl || '#' }); }); return result; };

        const gsHighlight = (text, query) => { if (!query || !text) return String(text || ''); const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); const parts = String(text).split(new RegExp(`(${escaped})`, 'gi')); return parts.map((part, i) => part.toLowerCase() === query.toLowerCase() ? <mark key={i} className="bg-amber-200 text-amber-900 rounded px-0.5">{part}</mark> : part ); };

        const MODULE_META = {
          manual:       { label: 'คู่มือ',      Icon: BookOpen,      bg: 'bg-teal-50',   text: 'text-teal-700',   border: 'border-teal-200',   badge: 'bg-teal-100 text-teal-700'   },
          archive:      { label: 'คลังเอกสาร', Icon: Library,       bg: 'bg-blue-50',   text: 'text-blue-700',   border: 'border-blue-200',   badge: 'bg-blue-100 text-blue-700'   },
          decision:     { label: 'Decision',    Icon: Cpu,           bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200', badge: 'bg-indigo-100 text-indigo-700' },
          chatbot:      { label: 'ถาม-ตอบ',     Icon: MessageCircle, bg: 'bg-cyan-50',   text: 'text-cyan-700',   border: 'border-cyan-200',   badge: 'bg-cyan-100 text-cyan-700'   },
          legal_search: { label: 'ค้นฎีกา',     Icon: Scale,         bg: 'bg-emerald-50',text: 'text-emerald-700',border: 'border-emerald-200',badge: 'bg-emerald-100 text-emerald-700'},
          ocs_comment:  { label: 'กฤษฎีกา',     Icon: Globe,         bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', badge: 'bg-purple-100 text-purple-700'},
          supreme_court:{ label: 'ศาลฎีกา',     Icon: Gavel,         bg: 'bg-rose-50',   text: 'text-rose-700',   border: 'border-rose-200',   badge: 'bg-rose-100 text-rose-700'}
        };

          const [searchQuery, setSearchQuery]   = useState('');

          const [newDataNotice, setNewDataNotice]       = useState(null);

          const { markVisited, isVisited } = useVisited();
          const bookmarkCtxVal = useMemo(() => ({ toggle: toggleBookmark, isBookmarked }), [toggleBookmark, isBookmarked]);
          const visitedCtxVal  = useMemo(() => ({ markVisited, isVisited }), [markVisited, isVisited]);

          useEffect(() => { const handler = () => forceBookmarkSync(n => n + 1); window.addEventListener('app_bookmark_update', handler); return () => window.removeEventListener('app_bookmark_update', handler); }, []);

          const manualDatabase  = useMemo(() => transformManualData(rawManualRows),   [rawManualRows]);
          const decisionRules   = useMemo(() => transformDecisionData(rawDecisionRows), [rawDecisionRows]);
          const archiveDatabase = useMemo(() => transformArchiveData(rawArchiveRows),  [rawArchiveRows]);
          const chatbotData     = rawChatbotRows;

          const currentMain    = useMemo(() => manualDatabase.find(m => m.id === viewState.mainId),            [manualDatabase, viewState.mainId]);
          const currentSub     = useMemo(() => currentMain?.subCategories.find(s => s.id === viewState.subId), [currentMain, viewState.subId]);
          const currentTopic   = useMemo(() => currentSub?.topics.find(t => t.id === viewState.topicId),       [currentSub, viewState.topicId]);
          const currentArcMain = useMemo(() => archiveDatabase.find(m => m.id === viewState.mainId),           [archiveDatabase, viewState.mainId]);
          const currentArcSub1 = useMemo(() => currentArcMain?.subCategories?.find(s => s.id === viewState.subId), [currentArcMain, viewState.subId]);
          const currentArcSub2 = useMemo(() => currentArcSub1?.topics?.find(t => t.id === viewState.topicId),      [currentArcSub1, viewState.topicId]);

          const abortRef = useRef(null);

          const loadDataFromSheets = useCallback(async (urls = sheetUrls, forceRefresh = false) => {
            if (abortRef.current) abortRef.current.abort(); const controller = new AbortController(); abortRef.current = controller; const signal = controller.signal;
            setIsLoading(true); setLoadError(false);
            const sources = [ { key: 'manual', label: URL_LABELS.manual, status: 'loading' }, { key: 'decision', label: URL_LABELS.decision, status: 'pending' }, { key: 'archive', label: URL_LABELS.archive, status: 'pending' }, { key: 'chatbot', label: URL_LABELS['chatbot_คนต่างด้าว'], status: 'pending' }, ];
            setLoadSources([...sources]); const updateSource = (key, status) => setLoadSources(prev => prev.map(s => s.key === key ? { ...s, status } : s));
            const fetchCSV = async (cacheKey, url) => { if (!forceRefresh) { const cached = cacheGet(cacheKey); if (cached) return cached; } const noCache = url.includes('?') ? `${url}&_t=${Date.now()}` : `${url}?_t=${Date.now()}`; const r = await fetch(noCache, { signal }); if (!r.ok) throw new Error(`HTTP ${r.status}`); const rows = parseCSV(await r.text()); cacheSet(cacheKey, rows); return rows; };

            try {
              updateSource('manual', 'loading'); try { setRawManualRows(await fetchCSV('manual', urls.manual)); updateSource('manual', 'done'); } catch (e) { if (e.name !== 'AbortError') updateSource('manual', 'error'); }
              if (signal.aborted) return; updateSource('decision', 'loading'); try { setRawDecisionRows(await fetchCSV('decision', urls.decision)); updateSource('decision', 'done'); } catch (e) { if (e.name !== 'AbortError') updateSource('decision', 'error'); }
              if (signal.aborted) return; updateSource('archive', 'loading'); try { setRawArchiveRows(await fetchCSV('archive', urls.archive)); updateSource('archive', 'done'); } catch (e) { if (e.name !== 'AbortError') updateSource('archive', 'error'); }
              if (signal.aborted) return; updateSource('chatbot', 'loading'); try { const allChatbot = []; for (const [key, url] of Object.entries(urls)) { if (!key.startsWith('chatbot_')) continue; if (signal.aborted) break; const cat = key.replace('chatbot_', ''); const rows = await fetchCSV(key, url); allChatbot.push(...transformChatbotData(rows, cat)); } setRawChatbotRows(allChatbot); updateSource('chatbot', 'done'); } catch (e) { if (e.name !== 'AbortError') updateSource('chatbot', 'error'); }
            } catch (err) { if (err.name !== 'AbortError') { console.error(err); setLoadError(true); } } finally { if (!signal.aborted) setIsLoading(false); }
          }, [sheetUrls]);

          useEffect(() => { loadDataFromSheets(); return () => abortRef.current?.abort(); }, []);

          const prevCountsRef = useRef(null);
          useEffect(() => {
            if (isLoading) return; const current = { manual: rawManualRows.length, decision: rawDecisionRows.length, archive: rawArchiveRows.length, chatbot: rawChatbotRows.length, };
            if (prevCountsRef.current) { const diff = {}; Object.keys(current).forEach(k => { const delta = current[k] - prevCountsRef.current[k]; if (delta > 0) diff[k] = delta; }); if (Object.keys(diff).length > 0) setNewDataNotice(diff); }
            prevCountsRef.current = current;

          const handleUpdateUrls = (newUrls) => { cacheClear(); setSheetUrls(newUrls); };

          const handleGlobalNavigate = useCallback((result) => {
            setSearchQuery(''); setActiveTab(result.tab); trackPageview(result.tab, result.title, result.path);
            if (result.tab === 'manual') { const { mainId, subId, topicId, sectionKey, level } = result.ids; setViewState({ level: level || 'detail', mainId: mainId || null, subId: subId || null, topicId: topicId || null, sectionKey: sectionKey || null }); } 
            else if (result.tab === 'archive') { const { mainId, subId, topicId, level } = result.ids; setViewState({ level: level || 'archiveContent', mainId: mainId || null, subId: subId || null, topicId: topicId || null, sectionKey: null }); } 
            else { setViewState({ level: result.tab === 'archive' ? 'archiveMain' : 'main', mainId: null, subId: null, topicId: null, sectionKey: null }); if (result.tab === 'decision') setDecisionResetKey(prev => prev + 1); }

                        {activeTab === 'chatbot'      && <ChatbotView chatbotData={chatbotData} onMiss={trackChatbotMiss} />}
                        {activeTab === 'legal_search' && <LegalSearchView />}
                        {activeTab === 'ocs_comment'  && <WebEmbedView url="https://comment.ocs.go.th" title="ระบบสืบค้นเรื่องเสร็จ คณะกรรมการกฤษฎีกา" icon={Globe} theme="purple" />} 
                        {activeTab === 'supreme_court' && <WebEmbedView url="https://deka.supremecourt.or.th/" title="ระบบสืบค้นคำพิพากษาศาลฎีกา" icon={Gavel} theme="rose" />}
                        {activeTab === 'favorites'    && (
                          <FavoritesView
                            bookmarks={bookmarks}
                            onNavigate={item => { handleGlobalNavigate(item); }}
                            onRemove={next => { bookmarkSave(next); window.dispatchEvent(new Event('app_bookmark_update')); }}
                          />
                        )}
                        
                        {/* 🌟 กล่องดันเนื้อหา (Spacer) ให้เลื่อนสุดโดยไม่โดนเมนูบัง */}
                        {!(activeTab === 'ocs_comment' || activeTab === 'supreme_court' || activeTab === 'chatbot') && (
                          <div className="h-[88px] md:h-0 w-full shrink-0 pointer-events-none" />
                        )}
                      </>
                    )}
                  </main>
                </div>
              </div>

              {adminOpen && (
                <AdminModal
                  rawData={{ manual: rawManualRows, decision: rawDecisionRows, archive: rawArchiveRows, chatbot: rawChatbotRows }}
                  onReloadData={() => { loadDataFromSheets(sheetUrls, true); }}
                  sheetUrls={sheetUrls}
                  onUpdateUrls={handleUpdateUrls}
                  onClose={() => setAdminOpen(false)}
                />
              )}
            </div>
            </VisitedCtx.Provider>
            </BookmarkCtx.Provider>
            </ErrorBoundary>
          );
        }

        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);
    </script>

    <!-- PWA Install Prompt Listener -->
    <script>
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
