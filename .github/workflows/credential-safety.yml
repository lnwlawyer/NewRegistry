name: Application Safety Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-safety:
    name: Application safety and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund



      - name: Run credential safety guard
        run: node tests/credential-safety.test.mjs

      - name: Run AI grounding safety guard
        run: node tests/ai-grounding-safety.test.mjs

      - name: Run data and decision logic tests
        run: node tests/data-decision-logic.test.mjs

      - name: Run modularization structure guard
        run: node tests/modularization-structure.test.mjs

      - name: Run build pipeline guard
        run: node tests/build-pipeline.test.mjs

      - name: Run PWA update safety guard
        run: node tests/pwa-update-safety.test.mjs

      - name: Run analytics privacy and integrity guard
        run: node tests/analytics-privacy.test.mjs

      - name: Run source data schema validation guard
        run: node tests/data-schema-validation.test.mjs

      - name: Run Tailwind build migration guard
        run: node tests/tailwind-build.test.mjs

      - name: Run accessibility and external-link resilience guard
        run: node tests/accessibility-external-links.test.mjs

      - name: Run AI retrieval and citation quality guard
        run: node tests/ai-retrieval-citations.test.mjs

      - name: Run production data quality observability guard
        run: node tests/data-quality-observability.test.mjs

      - name: Run runtime resilience and recovery guard
        run: node tests/runtime-resilience.test.mjs

      - name: Run search quality and relevance ranking guard
        run: node tests/search-ranking.test.mjs

      - name: Run search evaluation quality baseline guard
        run: node tests/search-evaluation.test.mjs

      - name: Build production artifact
        run: npm run build

      - name: Verify production artifact
        run: test -f dist/index.html && test -f dist/manifest.json && test -f dist/sw.js && test -f dist/icon-192.png && test -f dist/icon-512.png
