name: Application Safety Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-safety:
    name: Application safety and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm ci --no-audit --no-fund



      - name: Run credential safety guard
        run: node tests/credential-safety.test.mjs

      - name: Run AI grounding safety guard
        run: node tests/ai-grounding-safety.test.mjs

      - name: Run data and decision logic tests
        run: node tests/data-decision-logic.test.mjs

      - name: Run modularization structure guard
        run: node tests/modularization-structure.test.mjs

      - name: Run build pipeline guard
        run: node tests/build-pipeline.test.mjs

      - name: Run PWA update safety guard
        run: node tests/pwa-update-safety.test.mjs

      - name: Run analytics privacy and integrity guard
        run: node tests/analytics-privacy.test.mjs

      - name: Build production artifact
        run: npm run build

      - name: Verify production artifact
        run: test -f dist/index.html && test -f dist/manifest.json && test -f dist/sw.js && test -f dist/icon-192.png && test -f dist/icon-512.png
