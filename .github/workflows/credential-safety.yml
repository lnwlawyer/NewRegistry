name: Application Safety Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  application-safety:
    name: Application safety and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund


      - name: Commit generated dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'task-4b-vite-build-pipeline'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Vite build dependencies"
            git push origin HEAD:task-4b-vite-build-pipeline
          fi

      - name: Run credential safety guard
        run: node tests/credential-safety.test.mjs

      - name: Run AI grounding safety guard
        run: node tests/ai-grounding-safety.test.mjs

      - name: Run data and decision logic tests
        run: node tests/data-decision-logic.test.mjs

      - name: Run modularization structure guard
        run: node tests/modularization-structure.test.mjs

      - name: Run build pipeline guard
        run: node tests/build-pipeline.test.mjs

      - name: Build production artifact
        run: npm run build

      - name: Verify production artifact
        run: test -f dist/index.html && test -f dist/manifest.json && test -f dist/sw.js && test -f dist/icon-192.png && test -f dist/icon-512.png
